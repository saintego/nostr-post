<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nostr-post Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #1f2937;
        }
        body.dark { background: #1f2937; color: #f3f4f6; }
        h1 { margin-bottom: 0.5rem; }
        .subtitle { color: #6b7280; margin-bottom: 2rem; }
        #feed { margin-top: 2rem; }
    </style>
    <!-- nostr-shard-signer sign-in. Without a client ID: Nostr-only sign-in (extension, NIP-46 bunker).
         Set VITE_WEB3AUTH_CLIENT_ID to add Google/Apple/X: https://saintego.github.io/nostr-shard-signer/portal/ -->
    <script src="https://saintego.github.io/nostr-shard-signer/nostr-bridge.js" data-client-id="%VITE_WEB3AUTH_CLIENT_ID%"></script>
</head>
<body>
    <h1>🚀 nostr-post</h1>
    <p class="subtitle">Sign in with the button in the bottom-right corner, then create a post</p>
    
    <!-- Composer - works out of the box for Kind 1 posts -->
    <nostr-post-composer id="composer" auto-publish></nostr-post-composer>
    
    <!-- Feed - automatically fetches and displays events -->
    <nostr-post-feed id="feed" kinds="[1]" limit="20"></nostr-post-feed>

    <script type="module">
        import '../../packages/web/dist/index.js';
        
        const composer = document.getElementById('composer');
        const feed = document.getElementById('feed');

        // Dark mode sync
        const syncDark = () => document.body.classList.toggle('dark',
            matchMedia('(prefers-color-scheme: dark)').matches);
        syncDark();
        matchMedia('(prefers-color-scheme: dark)').onchange = syncDark;

        // Auth events - update feed to show user's posts
        // (replays the current state, so a restored session isn't missed)
        NostrBridge.onAuthChange(({ loggedIn, pubkey }) => {
            if (loggedIn) feed.authors = [pubkey];
        });


        // Refresh feed after publishing
        composer.addEventListener('nostr-post-published', () => {
            // Force refresh by re-setting authors
            feed.authors = [...(feed.authors || [])];
        });

        // Error handling
        composer.addEventListener('nostr-post-error', e => alert(e.detail.message));
    </script>
</body>
</html>

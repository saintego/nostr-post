<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nostr-post Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #1f2937;
        }
        body.dark { background: #1f2937; color: #f3f4f6; }
        h1 { margin-bottom: 0.5rem; }
        .subtitle { color: #6b7280; margin-bottom: 2rem; }
        #feed { margin-top: 2rem; }
    </style>
    <script src='https://unpkg.com/nostr-login@latest/dist/unpkg.js'
        data-bunkers="nsec.app,highlighter.com"
        data-perms="sign_event:1"
    ></script>
</head>
<body>
    <h1>🚀 nostr-post</h1>
    <p class="subtitle">Click the Nostr icon to login, then create a post</p>
    
    <!-- Composer - works out of the box for Kind 1 posts -->
    <nostr-post-composer id="composer" auto-publish></nostr-post-composer>
    
    <!-- Feed - automatically fetches and displays events -->
    <nostr-post-feed id="feed" kinds="[1]" limit="20"></nostr-post-feed>

    <script type="module">
        import '../../packages/web/dist/index.js';
        
        const composer = document.getElementById('composer');
        const feed = document.getElementById('feed');

        // Dark mode sync
        const syncDark = () => document.body.classList.toggle('dark', 
            localStorage.getItem('nl-dark-mode') === 'true' || 
            matchMedia('(prefers-color-scheme: dark)').matches);
        syncDark();
        matchMedia('(prefers-color-scheme: dark)').onchange = syncDark;
        addEventListener('storage', e => e.key === 'nl-dark-mode' && syncDark());

        // Auth events - update feed to show user's posts
        document.addEventListener('nlAuth', async e => {
            if (e.detail.type === 'login' || e.detail.type === 'signup') {
                const pubkey = await window.nostr.getPublicKey();
                feed.authors = [pubkey];
            }
        });

        // Refresh feed after publishing
        composer.addEventListener('nostr-post-published', () => {
            // Force refresh by re-setting authors
            feed.authors = [...(feed.authors || [])];
        });

        // Error handling
        composer.addEventListener('nostr-post-error', e => alert(e.detail.message));
    </script>
</body>
</html>

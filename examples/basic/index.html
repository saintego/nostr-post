<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nostr-post Example</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f9fafb;
        color: #111827;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }

      header {
        background: white;
        padding: 1.5rem 2rem;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 2rem;
      }

      header h1 {
        font-size: 1.875rem;
        font-weight: 700;
        color: #8b5cf6;
        margin-bottom: 0.5rem;
      }

      header p {
        color: #6b7280;
      }

      .login-section {
        background: white;
        padding: 2rem;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
        margin-bottom: 2rem;
        text-align: center;
      }

      .login-section h2 {
        margin-bottom: 1rem;
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      @media (max-width: 768px) {
        .main-content {
          grid-template-columns: 1fr;
        }
      }

      .section {
        background: white;
        padding: 1.5rem;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
      }

      .section h2 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #111827;
      }

      .events-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .filter-controls {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .filter-controls input {
        flex: 1;
        min-width: 200px;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
      }

      .filter-controls button {
        padding: 0.5rem 1rem;
        background: #8b5cf6;
        color: white;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        font-weight: 500;
      }

      .filter-controls button:hover {
        background: #7c3aed;
      }

      .empty-state {
        text-align: center;
        padding: 3rem;
        color: #6b7280;
      }

      .status-message {
        padding: 1rem;
        border-radius: 0.375rem;
        margin-bottom: 1rem;
      }

      .status-success {
        background: #d1fae5;
        border: 1px solid #6ee7b7;
        color: #065f46;
      }

      .status-error {
        background: #fef2f2;
        border: 1px solid #fca5a5;
        color: #dc2626;
      }

      nostr-post-composer,
      nostr-post-view {
        display: block;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>🚀 nostr-post Demo</h1>
        <p>Create and view Nostr posts with manifest-driven architecture</p>
      </div>
    </header>

    <div class="container">
      <!-- Login Section -->
      <div class="login-section" id="login-section">
        <h2>Connect with Nostr</h2>
        <p style="margin-bottom: 1rem; color: #6b7280;">
          Sign in to create and view posts
        </p>
        <div id="nostr-login-container"></div>
      </div>

      <!-- Status Messages -->
      <div id="status-container"></div>

      <!-- Main Content (Hidden until logged in) -->
      <div class="main-content" id="main-content" style="display: none;">
        <!-- Composer Section -->
        <div class="section">
          <h2>✍️ Create Post</h2>
          <nostr-post-composer id="composer"></nostr-post-composer>
        </div>

        <!-- Events Feed -->
        <div class="section">
          <h2>📰 Feed</h2>
          
          <div class="filter-controls">
            <input 
              type="text" 
              id="filter-search" 
              placeholder="Search posts..."
            />
            <button id="refresh-btn">Refresh</button>
          </div>

          <div id="events-list" class="events-list">
            <div class="empty-state">
              <p>No posts yet. Create your first post above!</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nostr-post Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #1f2937;
        }
        body.dark { background: #1f2937; color: #f3f4f6; }
        h1 { margin-bottom: 0.5rem; }
        .subtitle { color: #6b7280; margin-bottom: 2rem; }
        #events-list { display: flex; flex-direction: column; gap: 12px; margin-top: 2rem; }
        .loading { text-align: center; padding: 2rem; color: #6b7280; }
    </style>
    <script src='https://unpkg.com/nostr-login@latest/dist/unpkg.js'
        data-bunkers="nsec.app,highlighter.com"
        data-perms="sign_event:1"
    ></script>
</head>
<body>
    <h1>🚀 nostr-post</h1>
    <p class="subtitle">Click the Nostr icon to login, then create a post</p>
    
    <!-- Composer - works out of the box for Kind 1 posts -->
    <nostr-post-composer id="composer" auto-publish></nostr-post-composer>
    
    <!-- Events list -->
    <div id="events-list"></div>

    <script type="module">
        import { fetchEvents } from '../../packages/web/dist/index.js';

        const composer = document.getElementById('composer');
        const eventsList = document.getElementById('events-list');
        let pubkey = '';

        // Dark mode sync
        const syncDark = () => document.body.classList.toggle('dark', 
            localStorage.getItem('nl-dark-mode') === 'true' || 
            matchMedia('(prefers-color-scheme: dark)').matches);
        syncDark();
        matchMedia('(prefers-color-scheme: dark)').onchange = syncDark;
        addEventListener('storage', e => e.key === 'nl-dark-mode' && syncDark());

        // Auth events
        document.addEventListener('nlAuth', async e => {
            if (e.detail.type === 'login' || e.detail.type === 'signup') {
                pubkey = await window.nostr.getPublicKey();
                loadEvents();
            }
        });

        // Published event
        composer.addEventListener('nostr-post-published', e => {
            renderEvents([...e.detail.events, ...getExistingEvents()]);
        });

        // Error handling
        composer.addEventListener('nostr-post-error', e => alert(e.detail.message));

        // Load existing events
        async function loadEvents() {
            if (!pubkey) return;
            eventsList.innerHTML = '<div class="loading">Loading your posts...</div>';
            try {
                const events = await fetchEvents({ kinds: [1], authors: [pubkey], limit: 20 });
                renderEvents(events);
            } catch (e) {
                eventsList.innerHTML = '';
            }
        }

        // Render events
        function renderEvents(events) {
            eventsList.innerHTML = '';
            for (const event of events) {
                const view = document.createElement('nostr-post-view');
                view.event = event;
                view.showTags = false;
                eventsList.appendChild(view);
            }
        }

        // Get currently rendered events
        function getExistingEvents() {
            return Array.from(eventsList.querySelectorAll('nostr-post-view')).map(v => v.event);
        }
    </script>
</body>
</html>

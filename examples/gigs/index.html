<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gigs on Nostr</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #6366f1;
      --border: #e5e7eb;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #a5b4fc;
        --border: #374151;
        --warn-bg: #451a03;
        --warn-text: #fcd34d;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header {
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center;
      padding: 0.75rem 1rem; background: var(--card); border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header nav { display: flex; gap: 1rem; flex: 1; }
    a { color: var(--accent); }
    .banner {
      padding: 0.5rem 1rem; background: var(--warn-bg); color: var(--warn-text); font-size: 0.875rem;
    }
    main { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    label { display: inline-flex; flex-direction: column; gap: 0.25rem; font-size: 0.8125rem; color: var(--muted); }
    input, select, textarea, button {
      font: inherit; padding: 0.375rem 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem;
      background: var(--card); color: var(--text);
    }
    textarea { width: 100%; margin: 0.5rem 0; }
    button { cursor: pointer; background: var(--accent); color: #fff; border: none; }
    .step { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
    .step h3 { margin-top: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; }
    .hint { color: var(--muted); font-size: 0.875rem; }
    .warning { background: var(--warn-bg); color: var(--warn-text); padding: 0.5rem 0.75rem; border-radius: 0.375rem; margin-bottom: 0.75rem; }
    .share input { width: 100%; }
    .drafts { padding-left: 1.25rem; }
    .drafts li { margin: 0.25rem 0; }
    .switch { flex-direction: row; align-items: center; gap: 0.375rem; color: var(--text); }
    .performer { margin: 0.5rem 0 1rem; }
    .performer .warning { display: inline-block; margin: 0.25rem 0 0; font-size: 0.8125rem; }
  </style>
  <!-- nostr-shard-signer sign-in (the button in the bottom-right corner): Nostr-only (extension,
       NIP-46 bunker) without a client ID -->
  <script src="https://saintego.github.io/nostr-shard-signer/nostr-bridge.js"></script>
  <script type="module" src="../../nostr-post.js"></script>
</head>
<body>
  <header>
    <h1>🎸 Gigs</h1>
    <nav>
      <a href="#/">Browse</a>
      <a href="#/add">Add a gig</a>
      <a href="#/import">Import .ics</a>
      <a href="#/artist-new">Add an artist</a>
    </nav>
    <label class="switch"><input type="checkbox" id="test-mode" /> Test mode</label>
  </header>
  <div class="banner" id="test-banner" hidden>
    Test mode: sign in (bottom-right) to try adding gigs. Events are signed and shown, but nothing
    is sent to relays. Turn it off to publish.
  </div>
  <main id="main"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>

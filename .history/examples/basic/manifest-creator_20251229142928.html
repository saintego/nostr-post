<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manifest Creator - nostr-post</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f9fafb;
        color: #111827;
        line-height: 1.6;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
      }

      header {
        background: white;
        padding: 1.5rem 2rem;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 2rem;
      }

      header h1 {
        font-size: 1.875rem;
        font-weight: 700;
        color: #8b5cf6;
        margin-bottom: 0.5rem;
      }

      header p {
        color: #6b7280;
      }

      .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: white;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
        padding: 1.5rem;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #e5e7eb;
      }

      .panel-title {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: #374151;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        font-size: 1rem;
        font-family: inherit;
      }

      textarea {
        min-height: 100px;
        font-family: monospace;
      }

      button {
        padding: 0.5rem 1rem;
        background: #8b5cf6;
        color: white;
        border: none;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #7c3aed;
      }

      button.secondary {
        background: #6b7280;
      }

      button.secondary:hover {
        background: #4b5563;
      }

      button.danger {
        background: #dc2626;
      }

      button.danger:hover {
        background: #b91c1c;
      }

      .field-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .field-item {
        padding: 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.375rem;
        background: #f9fafb;
      }

      .field-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .field-item-title {
        font-weight: 600;
        color: #111827;
      }

      .field-item-details {
        font-size: 0.875rem;
        color: #6b7280;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .code-block {
        background: #1f2937;
        color: #e5e7eb;
        padding: 1rem;
        border-radius: 0.375rem;
        font-family: monospace;
        font-size: 0.875rem;
        overflow-x: auto;
        max-height: 600px;
        overflow-y: auto;
      }

      .button-group {
        display: flex;
        gap: 0.5rem;
      }

      .tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid #e5e7eb;
      }

      .tab {
        padding: 0.5rem 1rem;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        font-weight: 500;
        color: #6b7280;
      }

      .tab.active {
        color: #8b5cf6;
        border-bottom-color: #8b5cf6;
      }

      .examples-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .example-item {
        padding: 0.75rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      .example-item:hover {
        background: #f9fafb;
      }

      .example-title {
        font-weight: 600;
        color: #111827;
      }

      .example-desc {
        font-size: 0.875rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>📝 Manifest Creator</h1>
        <p>Design and test nostr-post manifests visually</p>
      </div>
    </header>

    <div class="container">
      <div class="main-grid">
        <!-- Editor Panel -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Manifest Editor</h2>
            <div class="button-group">
              <button id="clear-btn" class="secondary">Clear</button>
              <button id="save-btn">Save</button>
            </div>
          </div>

          <div class="tabs">
            <button class="tab active" data-tab="builder">Builder</button>
            <button class="tab" data-tab="json">JSON</button>
            <button class="tab" data-tab="examples">Examples</button>
          </div>

          <!-- Builder Tab -->
          <div id="builder-tab" class="tab-content">
            <div class="form-group">
              <label>Manifest ID</label>
              <input type="text" id="manifest-id" placeholder="my-manifest-v1" />
            </div>

            <div class="form-group">
              <label>Version</label>
              <input type="text" id="manifest-version" value="1.0.0" />
            </div>

            <div class="form-group">
              <label>Name</label>
              <input type="text" id="manifest-name" placeholder="My Custom Post" />
            </div>

            <div class="form-group">
              <label>Description</label>
              <textarea id="manifest-description" placeholder="Describe what this manifest does..."></textarea>
            </div>

            <div class="form-group">
              <label>Required Kinds (comma-separated)</label>
              <input type="text" id="manifest-kinds" value="1" placeholder="1, 30078" />
            </div>

            <div class="form-group">
              <label style="display: flex; justify-content: space-between; align-items: center;">
                <span>Fields</span>
                <button id="add-field-btn">+ Add Field</button>
              </label>
              <div id="fields-list" class="field-list"></div>
            </div>
          </div>

          <!-- JSON Tab -->
          <div id="json-tab" class="tab-content" style="display: none;">
            <textarea id="json-editor" style="min-height: 500px; font-family: monospace;"></textarea>
            <div style="margin-top: 1rem;">
              <button id="json-apply-btn">Apply JSON</button>
            </div>
          </div>

          <!-- Examples Tab -->
          <div id="examples-tab" class="tab-content" style="display: none;">
            <div class="examples-list" id="examples-list"></div>
          </div>
        </div>

        <!-- Preview Panel -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Live Preview</h2>
            <div class="button-group">
              <button id="copy-btn">Copy JSON</button>
              <button id="download-btn">Download</button>
            </div>
          </div>

          <div class="tabs">
            <button class="tab active" data-preview="form">Form</button>
            <button class="tab" data-preview="code">Code</button>
          </div>

          <!-- Form Preview -->
          <div id="form-preview" style="margin-top: 1rem;">
            <nostr-post-composer id="preview-composer"></nostr-post-composer>
          </div>

          <!-- Code Preview -->
          <div id="code-preview" style="display: none; margin-top: 1rem;">
            <pre class="code-block" id="code-output"></pre>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/manifest-creator.ts"></script>
  </body>
</html>

name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build
      
      # Build CDN bundle
      - run: cd packages/cdn && pnpm build
      
      # Create deployment directory structure
      - run: mkdir -p .deploy
      - run: cp -r packages/cdn/dist/* .deploy/
      - run: cp packages/cdn/index.html .deploy/index.html
      
      # Build and copy manifest-creator
      - run: cp -r tools/manifest-creator/out .deploy/manifest-creator

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

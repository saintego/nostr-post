name: PR Preview (nsite)

# Deploys each pull request as a named nsite (NIP-5A, kind 35128, d tag `pr-<number>`) and
# comments its URL on the PR; removes the site's manifest when the PR is closed.
#
# Setup (repository settings → Secrets and variables → Actions):
# - secret NSITE_PREVIEW_SEC: signing secret of a key used only for previews (nsec or nbunksec)
# - variable NSITE_PREVIEW_PUBKEY: that key's public key as 64-char hex (for the preview URL)
# - optional variables: NSITE_GATEWAY (default nsite.lol), NSITE_RELAYS and NSITE_SERVERS
#   (comma separated)
# Without the secret the job is skipped. PRs from forks get no preview: secrets aren't passed
# to their workflows.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NSYTE_VERSION: v0.28.1
  SITE_NAME: pr-${{ github.event.pull_request.number }}
  NSITE_SEC: ${{ secrets.NSITE_PREVIEW_SEC }}
  NSITE_PUBKEY: ${{ vars.NSITE_PREVIEW_PUBKEY }}
  NSITE_GATEWAY: ${{ vars.NSITE_GATEWAY || 'nsite.lol' }}
  NSITE_RELAYS: ${{ vars.NSITE_RELAYS || 'wss://relay.nsite.lol,wss://relay.primal.net' }}
  NSITE_SERVERS: ${{ vars.NSITE_SERVERS || 'https://cdn.hzrd149.com,https://cdn.sovbit.host' }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: config
        run: |
          if [ -z "$NSITE_SEC" ] || [ -z "$NSITE_PUBKEY" ]; then
            echo "NSITE_PREVIEW_SEC or NSITE_PREVIEW_PUBKEY not set; skipping the preview."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.enabled == 'true'
        run: |
          curl -fsSL -o /usr/local/bin/nsyte \
            "https://github.com/sandwichfarm/nsyte/releases/download/${NSYTE_VERSION}/nsyte-linux-${NSYTE_VERSION#v}"
          chmod +x /usr/local/bin/nsyte

      # Closed PR: delete the site manifest so the gateway stops serving it. Blobs stay on the
      # Blossom servers: they're content-addressed and shared with other previews of the same key.
      # `nsyte delete` has no --no-config, so it gets a minimal config file. It also fails when
      # the PR never had a preview (e.g. opened before the secret was set): only warn then.
      - if: steps.config.outputs.enabled == 'true' && github.event.action == 'closed'
        run: |
          node -e 'const [r, s] = process.argv.slice(1).map((v) => v.split(","));
            console.log(JSON.stringify({ relays: r, servers: s }))' \
            "$NSITE_RELAYS" "$NSITE_SERVERS" > "$RUNNER_TEMP/nsite-config.json"
          nsyte delete -c "$RUNNER_TEMP/nsite-config.json" --name "$SITE_NAME" --yes \
            --sec "$NSITE_SEC" --relays "$NSITE_RELAYS" --servers "$NSITE_SERVERS" \
            || echo "::warning::Could not delete nsite $SITE_NAME (no preview deployed, or relays unreachable)."

      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: actions/checkout@v4

      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: pnpm/action-setup@v4

      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        run: pnpm install

      # Same tree as GitHub Pages, served from the site root (.pages-local)
      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        run: pnpm build:pages

      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        run: |
          nsyte deploy .pages-local --name "$SITE_NAME" --sec "$NSITE_SEC" \
            --relays "$NSITE_RELAYS" --servers "$NSITE_SERVERS" \
            --no-config --non-interactive --skip-secrets-scan

      # Named site host: the pubkey in base36 (50 chars), then the d tag (NIP-5A)
      - id: url
        if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        run: |
          label=$(node -e 'console.log(BigInt("0x" + process.argv[1]).toString(36).padStart(50, "0") + process.argv[2])' "$NSITE_PUBKEY" "$SITE_NAME")
          echo "url=https://${label}.${NSITE_GATEWAY}/" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const marker = '<!-- nsite-preview -->';
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Preview (nsite):** ${url}`,
              '',
              `- Examples: ${url}examples/`,
              `- Manifest creator: ${url}manifest-creator/`,
              '',
              `Built from ${sha}. Removed when the PR is closed.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

name: PR Preview (nsite)

# Deploys each pull request as a named nsite (NIP-5A, kind 35128, d tag `pr-<number>`) and
# comments its URL on the PR; removes the site's manifest when the PR is closed.
#
# Setup (repository settings → Secrets and variables → Actions):
# - secret NSITE_PREVIEW_SEC: signing secret of a key used only for previews (nsec or nbunksec)
# - variable NSITE_PREVIEW_PUBKEY: that key's public key, npub or hex (for the preview URL)
# - optional variables: NSITE_GATEWAY (default nsite.lol), NSITE_RELAYS and NSITE_SERVERS
#   (comma separated). An unreachable server slows the deploy a lot: nsyte retries every file.
# Without the secret the job is skipped. PRs from forks get no preview: secrets aren't passed
# to their workflows.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NSYTE_VERSION: v0.28.1
  SITE_NAME: pr-${{ github.event.pull_request.number }}
  NSITE_SEC: ${{ secrets.NSITE_PREVIEW_SEC }}
  NSITE_PUBKEY: ${{ vars.NSITE_PREVIEW_PUBKEY }}
  NSITE_GATEWAY: ${{ vars.NSITE_GATEWAY || 'nsite.lol' }}
  NSITE_RELAYS: ${{ vars.NSITE_RELAYS || 'wss://relay.nsite.lol,wss://relay.primal.net' }}
  NSITE_SERVERS: ${{ vars.NSITE_SERVERS || 'https://cdn.hzrd149.com,https://blossom.primal.net' }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: config
        run: |
          if [ -z "$NSITE_SEC" ] || [ -z "$NSITE_PUBKEY" ]; then
            echo "NSITE_PREVIEW_SEC or NSITE_PREVIEW_PUBKEY not set; skipping the preview."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.enabled == 'true'
        run: |
          curl -fsSL -o /usr/local/bin/nsyte \
            "https://github.com/sandwichfarm/nsyte/releases/download/${NSYTE_VERSION}/nsyte-linux-${NSYTE_VERSION#v}"
          chmod +x /usr/local/bin/nsyte

      # Closed PR: first replace the site with a "preview removed" page (index.html and 404.html,
      # so every old path shows it). relay.nsite.lol, which the nsite.lol gateway reads, only
      # accepts nsite kinds, not kind 5 deletions, but a newer kind 35128 replaces the old one.
      # `deploy` never deletes blobs: they're content-addressed and shared with other previews.
      # Then delete the manifest on the relays that honor deletions. `nsyte delete` has no
      # --no-config, so it gets a minimal config file. It also fails when the PR never had a
      # preview (e.g. opened before the secret was set): only warn then.
      # Relative paths: nsyte resolves the deploy folder against the working directory even
      # when it's absolute.
      - if: steps.config.outputs.enabled == 'true' && github.event.action == 'closed'
        working-directory: ${{ runner.temp }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          mkdir -p removed
          printf '<!doctype html><meta charset="utf-8"><title>Preview removed</title><p>This preview was removed when <a href="%s">%s</a> was closed.</p>\n' \
            "$PR_URL" "$PR_URL" > removed/index.html
          cp removed/index.html removed/404.html
          nsyte deploy removed --name "$SITE_NAME" --sec "$NSITE_SEC" \
            --relays "$NSITE_RELAYS" --servers "$NSITE_SERVERS" \
            --no-config --non-interactive --skip-secrets-scan
          node -e 'const [r, s] = process.argv.slice(1).map((v) => v.split(","));
            console.log(JSON.stringify({ relays: r, servers: s }))' \
            "$NSITE_RELAYS" "$NSITE_SERVERS" > nsite-config.json
          nsyte delete -c nsite-config.json --name "$SITE_NAME" --yes \
            --sec "$NSITE_SEC" --relays "$NSITE_RELAYS" --servers "$NSITE_SERVERS" \
            || echo "::warning::Could not delete nsite $SITE_NAME (no preview deployed, or relays unreachable)."

      - if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip the deploy when only Markdown changed since the last preview (the push's `before`
      # commit; the PR base on open/reopen): no .md file goes into the site. The previous preview
      # and its comment stay. If the diff fails (e.g. `before` gone after a force push), deploy.
      - id: changes
        if: steps.config.outputs.enabled == 'true' && github.event.action != 'closed'
        env:
          SINCE: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          if files=$(git diff --name-only "$SINCE" HEAD) && [ -n "$files" ] \
            && ! grep -qvE '\.md$' <<< "$files"; then
            echo "Only Markdown changed; keeping the current preview."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - if: steps.changes.outputs.deploy == 'true'
        run: pnpm install

      # Same tree as GitHub Pages, served from the site root (.pages-local)
      - if: steps.changes.outputs.deploy == 'true'
        run: pnpm build:pages

      - if: steps.changes.outputs.deploy == 'true'
        run: |
          nsyte deploy .pages-local --name "$SITE_NAME" --sec "$NSITE_SEC" \
            --relays "$NSITE_RELAYS" --servers "$NSITE_SERVERS" \
            --no-config --non-interactive --skip-secrets-scan

      # Named site host: the pubkey in base36 (50 chars), then the d tag (NIP-5A). The pubkey may
      # be an npub (bech32 data minus the 6-char checksum, 5 bits per char) or hex.
      - id: url
        if: steps.changes.outputs.deploy == 'true'
        run: |
          label=$(node -e '
            const [key, name] = process.argv.slice(1);
            const pubkey = key.startsWith("npub1")
              ? BigInt("0b" + [...key.slice(5, -6)]
                  .map((c) => "qpzry9x8gf2tvdw0s3jn54khce6mua7l".indexOf(c).toString(2).padStart(5, "0"))
                  .join("").slice(0, 256))
              : BigInt("0x" + key);
            console.log(pubkey.toString(36).padStart(50, "0") + name);' "$NSITE_PUBKEY" "$SITE_NAME")
          echo "url=https://${label}.${NSITE_GATEWAY}/" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const marker = '<!-- nsite-preview -->';
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Preview (nsite):** ${url}`,
              '',
              `- Examples: ${url}examples/`,
              `- Manifest creator: ${url}manifest-creator/`,
              '',
              `Built from ${sha}. Removed when the PR is closed.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
